// I3C IBI coverage hierarchy filter.
//
// Exclude the complete DUT hierarchy explicitly. VCS does not interpret '*'
// as a root hierarchy selector in a -cm_hier file, so the former "-tree *"
// entry left RTL DAA/CCC cover properties and an internal bus-FSM covergroup
// in the IBI report. UVM class covergroups are not module hierarchy objects
// and remain collected.
-tree tb_smc_peripherals_top.u_dut
// Retain only the requirement-owned IBI SVA instances at testbench scope.
// smc_i3c_boundary_sva is deliberately absent: it owns generic AXI/CSR
// handshake stability and access-denial behavior, not IBI protocol behavior.
// Closing its five backpressure properties and two access_allow=0 properties
// requires a dedicated AXI boundary suite; mixing them into this run would
// change the IBI assertion denominator without adding IBI evidence.
+tree tb_smc_peripherals_top.u_i3c_ibi_bus_sva
+tree tb_smc_peripherals_top.u_i3c_ibi_protocol_sva
+tree tb_smc_peripherals_top.u_i3c_ibi_controller_sva
+tree tb_smc_peripherals_top.u_i3c_ibi_target_sva
