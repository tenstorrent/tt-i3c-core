// I3C IBI coverage hierarchy filter.
//
// Exclude the complete DUT hierarchy explicitly. VCS does not interpret '*'
// as a root hierarchy selector in a -cm_hier file, so the former "-tree *"
// entry left RTL DAA/CCC cover properties and an internal bus-FSM covergroup
// in the IBI report. UVM class covergroups are not module hierarchy objects
// and remain collected.
-tree tb_i3c_top.u_dut
// Retain only the requirement-owned IBI SVA instances at testbench scope.
// AXI/CSR boundary policy is outside this IBI-only coverage configuration.
+tree tb_i3c_top.u_i3c_ibi_bus_sva
+tree tb_i3c_top.u_i3c_ibi_protocol_sva
+tree tb_i3c_top.u_i3c_ibi_controller_sva
+tree tb_i3c_top.u_i3c_ibi_target_sva
